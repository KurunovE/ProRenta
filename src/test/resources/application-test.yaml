server:
  port: 8081

spring:
  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:/db/changelog/changelog.yaml
    enabled: true

user:
  service:
    url: http://localhost:${wiremock.server.port}

cbr:
  exchange-rates:
    url: http://localhost:${wiremock.server.port}
    value: /XML_daily.asp

scheduler:
  cdr-scheduler:
    cron: "-"
    zone: Europe/Moscow