server:
  port: 8081

user:
  service:
    url: http://localhost:9090

cbr:
  exchange-rates:
    url: https://www.cbr.ru/scripts
    value: /XML_daily.asp

scheduler:
  cdr-scheduler:
    cron: 0 0 15 * * MON-FRI
    zone: Europe/Moscow

spring:
  datasource:
    url: jdbc:h2:mem:finance_db
    driver-class-name: org.h2.Driver
    username: admin
    password: pass

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:/db/changelog/changelog.yaml
    enabled: true

  cache:
    type: simple
    cache-names: currencies_by_code, all_currencies, currency_dto_by_id, currency_entity_by_id

logging:
  level:
    root: info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs-ui.html